[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/mmazzieri/DiaryCraft"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "warn"
wildcard_imports = "deny"
dbg_macro = "warn"

[workspace.dependencies]
diarycraft-model = { path = "crates/model" }
diarycraft-engine = { path = "crates/engine" }
diarycraft-file = { path = "crates/file" }
diarycraft-ui-egui = { path = "crates/ui-egui" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
sys-locale = "0.3"
tempfile = "3"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
